name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MaxPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-apk
          path: MaxPlayer.apk

      # Прямая ссылка на APK без архива: раздел Releases в репозитории
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Max Player (последняя сборка)
          body: Свежая сборка. Скачайте MaxPlayer.apk и установите на телефон.
          files: MaxPlayer.apk
          make_latest: true
